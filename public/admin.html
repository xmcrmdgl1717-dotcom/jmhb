<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0B0C10"/>
<title>NEXUS SLOT · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0B0C10;--panel:#13151f;--panel2:#181b28;
  --cyan:#00F0FF;--gold:#FFD700;--green:#22c55e;--red:#ef4444;
  --d:Orbitron,sans-serif;--n:Rajdhani,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#e8eefc;font-family:var(--n);min-height:100vh}
body{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(176,38,255,.15),transparent 55%),radial-gradient(ellipse 70% 40% at 80% 100%,rgba(0,240,255,.08),transparent 50%),var(--bg);background-attachment:fixed}
input,button,select{font-family:inherit}
.container{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
/* ===== 登录页 ===== */
#loginView{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:100%;max-width:380px;padding:34px 26px 26px;border-radius:22px;background:linear-gradient(180deg,#1a1d2c,#10121a);box-shadow:0 0 0 1px rgba(0,240,255,.25),0 0 50px rgba(176,38,255,.15),0 24px 48px rgba(0,0,0,.5)}
.login-logo{display:flex;justify-content:center;margin-bottom:18px}
.login-logo svg{width:56px;height:56px}
.login-title{font-family:var(--d);font-weight:800;font-size:20px;letter-spacing:.15em;text-align:center;background:linear-gradient(90deg,#fff,var(--cyan),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 4px}
.login-sub{text-align:center;font-size:11px;letter-spacing:.28em;color:rgba(0,240,255,.6);margin-bottom:24px}
.login-card label{display:block;font-family:var(--d);font-size:10px;letter-spacing:.18em;color:#7AF7FF;margin-bottom:8px}
.login-card input{width:100%;height:48px;border-radius:12px;border:1px solid rgba(0,240,255,.3);background:rgba(8,10,16,.9);color:#e8eefc;font-size:16px;padding:0 14px;outline:0;margin-bottom:14px}
.login-card input:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.25)}
.login-card button{width:100%;height:50px;border:0;border-radius:14px;cursor:pointer;font-family:var(--d);font-weight:800;font-size:13px;letter-spacing:.18em;color:#041018;background:linear-gradient(180deg,#7af7ff,var(--cyan) 40%,#12b8d4);box-shadow:0 8px 0 #0a6e80,0 0 24px rgba(0,240,255,.35);transition:transform .1s}
.login-card button:active{transform:translateY(4px);box-shadow:0 4px 0 #0a6e80}
.login-err{color:#ff8aa0;font-size:12px;min-height:18px;text-align:center;margin-bottom:8px}
/* ===== 主界面 ===== */
#mainView{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-bottom:18px;border-radius:16px;background:linear-gradient(165deg,rgba(30,34,52,.9),rgba(14,16,26,.95));border:1px solid rgba(0,240,255,.25);box-shadow:0 0 20px rgba(0,240,255,.06)}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .brand svg{width:36px;height:36px}
.topbar h1{margin:0;font-family:var(--d);font-weight:800;font-size:16px;letter-spacing:.14em;background:linear-gradient(90deg,#fff,var(--cyan),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .sub{font-size:10px;letter-spacing:.28em;color:rgba(0,240,255,.55)}
.logout-btn{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,90,122,.5);background:rgba(255,90,122,.1);color:#ff8aa0;font-family:var(--d);font-size:11px;letter-spacing:.12em;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:rgba(255,90,122,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat-card{padding:16px;border-radius:14px;background:linear-gradient(165deg,rgba(30,34,52,.85),rgba(14,16,26,.9));border:1px solid rgba(0,240,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stat-card .label{font-family:var(--d);font-size:10px;letter-spacing:.16em;color:rgba(0,240,255,.7);margin-bottom:6px}
.stat-card .value{font-family:var(--d);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.35)}
.stat-card .value.cyan{color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.35)}
.stat-card .value.green{color:var(--green);text-shadow:0 0 12px rgba(34,197,94,.35)}
.section{padding:18px;border-radius:16px;background:linear-gradient(165deg,rgba(30,34,52,.85),rgba(14,16,26,.9));border:1px solid rgba(0,240,255,.18);margin-bottom:18px}
.section h2{margin:0 0 14px;font-family:var(--d);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--cyan);display:flex;align-items:center;gap:8px}
.section h2 svg{width:16px;height:16px;flex-shrink:0}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-field{flex:1;min-width:200px}
.form-field label{display:block;font-family:var(--d);font-size:10px;letter-spacing:.14em;color:#7AF7FF;margin-bottom:6px}
.form-field input{width:100%;height:44px;border-radius:10px;border:1px solid rgba(0,240,255,.28);background:rgba(8,10,16,.85);color:#e8eefc;font-size:14px;padding:0 12px;outline:0}
.form-field input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.2)}
.btn{padding:0 20px;height:44px;border-radius:10px;border:0;cursor:pointer;font-family:var(--d);font-weight:700;font-size:12px;letter-spacing:.12em;transition:transform .1s,box-shadow .2s}
.btn-primary{color:#041018;background:linear-gradient(180deg,#7af7ff,var(--cyan) 40%,#12b8d4);box-shadow:0 4px 0 #0a6e80}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #0a6e80}
.btn-tg{color:#fff;background:linear-gradient(180deg,#33a3e0,#0088cc);box-shadow:0 4px 0 #005e8f}
.btn-tg:active{transform:translateY(3px);box-shadow:0 1px 0 #005e8f}
/* ===== 记录列表 ===== */
.records-list{display:flex;flex-direction:column;gap:10px}
.record-item{padding:14px;border-radius:12px;background:rgba(8,10,16,.75);border:1px solid rgba(255,255,255,.06);transition:border-color .2s}
.record-item:hover{border-color:rgba(0,240,255,.3)}
.record-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.record-addr{font-family:monospace;font-size:13px;color:#7AF7FF;word-break:break-all;flex:1;min-width:200px}
.record-badge{padding:4px 10px;border-radius:999px;font-family:var(--d);font-size:10px;letter-spacing:.1em;font-weight:700;white-space:nowrap}
.badge-pending{background:rgba(255,215,0,.15);color:#FFD700;border:1px solid rgba(255,215,0,.4)}
.badge-approved{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.badge-rejected{background:rgba(239,68,68,.15);color:#ff8aa0;border:1px solid rgba(239,68,68,.4)}
.record-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(220,230,245,.85);white-space:nowrap}
.chip-os{color:#7AF7FF;border-color:rgba(0,240,255,.3);background:rgba(0,240,255,.08)}
.chip-browser{color:#c084fc;border-color:rgba(192,132,252,.3);background:rgba(192,132,252,.08)}
.chip-amt{color:#FFD700;border-color:rgba(255,215,0,.35);background:rgba(255,215,0,.08);font-weight:700}
.chip-ip{color:#94a3b8}
.record-actions{display:flex;gap:8px;flex-wrap:wrap}
.act-btn{padding:8px 16px;border-radius:8px;border:0;cursor:pointer;font-family:var(--d);font-size:11px;letter-spacing:.1em;font-weight:700;transition:transform .1s}
.act-approve{color:#041018;background:linear-gradient(180deg,#4ade80,#22c55e)}
.act-reject{color:#fff;background:linear-gradient(180deg,#f87171,#ef4444)}
.act-copy{color:#7AF7FF;background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.35)}
.act-btn:active{transform:translateY(2px)}
.empty{padding:40px 20px;text-align:center;color:rgba(200,210,230,.5);font-size:14px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:6px 14px;border-radius:999px;border:1px solid rgba(0,240,255,.25);background:transparent;color:rgba(220,230,245,.7);font-family:var(--d);font-size:11px;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.filter-btn.active{background:rgba(0,240,255,.12);color:var(--cyan);border-color:var(--cyan)}
.batch-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px;border-radius:10px;background:rgba(0,240,255,.05);border:1px dashed rgba(0,240,255,.3)}
.batch-bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(220,230,245,.85);cursor:pointer}
.batch-bar input[type=checkbox]{width:16px;height:16px;accent-color:#00F0FF}
.record-checkbox{width:18px;height:18px;accent-color:#00F0FF;cursor:pointer;flex-shrink:0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);padding:12px 22px;border-radius:999px;background:rgba(13,14,21,.95);border:1px solid rgba(0,240,255,.4);font-family:var(--d);font-size:12px;letter-spacing:.1em;color:var(--cyan);opacity:0;pointer-events:none;z-index:100;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){
  .container{padding:14px 10px 40px}
  .section{padding:14px}
  .topbar{padding:12px}
  .topbar h1{font-size:14px}
  .record-addr{font-size:11px}
  .act-btn{padding:7px 12px;font-size:10px}
}
</style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 7v5c0 5.2 3.4 10 8 11 4.6-1 8-5.8 8-11V7l-8-5z" stroke="#00F0FF" stroke-width="1.6" fill="rgba(0,240,255,.12)"/><path d="M12 8v8M8.5 12h7" stroke="#FFD166" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <h1 class="login-title">NEXUS ADMIN</h1>
    <div class="login-sub">QUANTUM SLOT CONTROL</div>
    <div class="login-err" id="loginErr"></div>
    <label for="pwdInput">管理员密码</label>
    <input id="pwdInput" type="password" placeholder="请输入管理员密码" autocomplete="current-password"/>
    <button id="loginBtn" type="button">登 录</button>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="mainView">
  <div class="container">

    <!-- 顶栏 -->
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 7v5c0 5.2 3.4 10 8 11 4.6-1 8-5.8 8-11V7l-8-5z" stroke="#00F0FF" stroke-width="1.6" fill="rgba(0,240,255,.12)"/><path d="M12 8v8M8.5 12h7" stroke="#FFD166" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div>
          <h1>NEXUS ADMIN</h1>
          <div class="sub">QUANTUM SLOT CONTROL</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">退出登录</button>
    </div>

    <!-- 统计 -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">总提现记录</div>
        <div class="value cyan" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="label">等待审核</div>
        <div class="value" id="statPending">0</div>
      </div>
      <div class="stat-card">
        <div class="label">已通过金额 (USDT)</div>
        <div class="value green" id="statApprovedAmt">0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">待审核金额 (USDT)</div>
        <div class="value" id="statPendingAmt">0.00</div>
      </div>
    </div>

    <!-- 飞机号配置 -->
    <div class="section">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        飞机客服链接设置 (Telegram)
      </h2>
      <div class="form-row">
        <div class="form-field">
          <label for="telegramLinkInput">完整链接 (以 https://t.me/ 开头)</label>
          <input type="text" id="telegramLinkInput" placeholder="https://t.me/your_support" autocomplete="off"/>
        </div>
        <button class="btn btn-tg" id="saveTelegramBtn" type="button">保存飞机号</button>
      </div>
    </div>

    <!-- 每日限制设置 -->
    <div class="section">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        每日免费轮次限制
      </h2>
      <div class="form-row">
        <div class="form-field">
          <label for="dailyLimitInput">每日轮次 (1-100)</label>
          <input type="number" id="dailyLimitInput" min="1" max="100" placeholder="1" autocomplete="off"/>
        </div>
        <button class="btn btn-primary" id="saveLimitBtn" type="button">保存限制</button>
      </div>
    </div>

    <!-- 修改密码 -->
    <div class="section">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        修改管理员密码
      </h2>
      <div class="form-row">
        <div class="form-field">
          <label for="newPwdInput">新密码 (至少6位)</label>
          <input type="password" id="newPwdInput" placeholder="输入新密码" autocomplete="new-password"/>
        </div>
        <button class="btn btn-primary" id="changePwdBtn" type="button">修改密码</button>
      </div>
    </div>

    <!-- 提现记录 -->
    <div class="section">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        提现记录列表
      </h2>

      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all" type="button">全部</button>
        <button class="filter-btn" data-filter="pending" type="button">待审核</button>
        <button class="filter-btn" data-filter="approved" type="button">已通过</button>
        <button class="filter-btn" data-filter="rejected" type="button">已拒绝</button>
      </div>

      <div class="batch-bar">
        <label><input type="checkbox" id="selectAllChk"/>全选当页待审核</label>
        <button class="btn act-approve" id="batchApproveBtn" type="button" style="height:36px;padding:0 14px;">批量通过</button>
        <button class="btn act-reject" id="batchRejectBtn" type="button" style="height:36px;padding:0 14px;">批量拒绝</button>
      </div>

      <div class="records-list" id="recordsList">
        <div class="empty">加载中...</div>
      </div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 全局状态
// ============================================================
const API_BASE = '';
let TOKEN = localStorage.getItem('adminToken') || '';
let ALL_RECORDS = [];
let CURRENT_FILTER = 'all';
let CONFIG = { dailyLimit: 1, telegramLink: '' };

const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

function authHeaders(){
  return { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
}

// ============================================================
// 登录 / 退出
// ============================================================
async function doLogin(){
  const pwd = $('pwdInput').value.trim();
  const err = $('loginErr');
  err.textContent = '';
  if (!pwd) { err.textContent = '请输入密码'; return; }
  try {
    const res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || '登录失败'; return; }
    TOKEN = data.token;
    localStorage.setItem('adminToken', TOKEN);
    showMain();
  } catch (e) {
    err.textContent = '网络错误，请重试';
  }
}

function doLogout(){
  TOKEN = '';
  localStorage.removeItem('adminToken');
  $('mainView').style.display = 'none';
  $('loginView').style.display = 'flex';
  $('pwdInput').value = '';
}

function showMain(){
  $('loginView').style.display = 'none';
  $('mainView').style.display = 'block';
  loadConfig();
  loadRecords();
}

// ============================================================
// 配置相关
// ============================================================
async function loadConfig(){
  try {
    const res = await fetch(API_BASE + '/api/config', { headers: authHeaders() });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    CONFIG = data;
    $('dailyLimitInput').value = data.dailyLimit || 1;
    $('telegramLinkInput').value = data.telegramLink || '';
  } catch (e) {
    console.warn('加载配置失败', e);
  }
}

async function saveTelegram(){
  const link = $('telegramLinkInput').value.trim();
  if (!link || !/^https?:\/\//i.test(link)) {
    toast('请输入完整链接 (http/https 开头)');
    return;
  }
  try {
    const res = await fetch(API_BASE + '/api/admin/settings', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ telegramLink: link })
    });
    const data = await res.json();
    if (res.ok && data.success) toast('飞机号保存成功');
    else toast(data.error || '保存失败');
  } catch (e) { toast('网络错误'); }
}

async function saveLimit(){
  const limit = parseInt($('dailyLimitInput').value, 10);
  if (!limit || limit < 1 || limit > 100) { toast('请输入 1-100 之间的数字'); return; }
  try {
    const res = await fetch(API_BASE + '/api/config', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ dailyLimit: limit })
    });
    const data = await res.json();
    if (res.ok && data.success) toast('每日限制已保存');
    else toast(data.error || '保存失败');
  } catch (e) { toast('网络错误'); }
}

async function changePwd(){
  const pwd = $('newPwdInput').value.trim();
  if (pwd.length < 6) { toast('密码至少6位'); return; }
  try {
    const res = await fetch(API_BASE + '/api/change-password', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ newPassword: pwd })
    });
    const data = await res.json();
    if (res.ok && data.success) { toast('密码已修改'); $('newPwdInput').value = ''; }
    else toast(data.error || '修改失败');
  } catch (e) { toast('网络错误'); }
}

// ============================================================
// 记录相关
// ============================================================
async function loadRecords(){
  try {
    const res = await fetch(API_BASE + '/api/records', { headers: authHeaders() });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    ALL_RECORDS = Array.isArray(data) ? data : [];
    renderStats();
    renderRecords();
  } catch (e) {
    $('recordsList').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
}

function renderStats(){
  const total = ALL_RECORDS.length;
  const pendingList = ALL_RECORDS.filter(r => r.status === 'pending');
  const approvedList = ALL_RECORDS.filter(r => r.status === 'approved');
  const pendingAmt = pendingList.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const approvedAmt = approvedList.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  $('statTotal').textContent = total;
  $('statPending').textContent = pendingList.length;
  $('statPendingAmt').textContent = pendingAmt.toFixed(2);
  $('statApprovedAmt').textContent = approvedAmt.toFixed(2);
}

function statusBadge(status){
  if (status === 'approved') return '<span class="record-badge badge-approved">已通过</span>';
  if (status === 'rejected') return '<span class="record-badge badge-rejected">已拒绝</span>';
  return '<span class="record-badge badge-pending">等待审核</span>';
}

function esc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso){
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso || '';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  } catch { return iso || ''; }
}

function renderRecords(){
  const list = $('recordsList');
  let filtered = ALL_RECORDS;
  if (CURRENT_FILTER !== 'all') filtered = ALL_RECORDS.filter(r => r.status === CURRENT_FILTER);

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  list.innerHTML = filtered.map(r => {
    const checked = r.status === 'pending' ? '<input type="checkbox" class="record-checkbox" data-id="' + r.id + '"/>' : '';
    const actions = r.status === 'pending'
      ? `<button class="act-btn act-approve" data-act="approve" data-id="${r.id}">✔ 通过</button>
         <button class="act-btn act-reject" data-act="reject" data-id="${r.id}">✘ 拒绝</button>`
      : '';
    return `
      <div class="record-item" data-id="${r.id}">
        <div class="record-top">
          <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:200px;">
            ${checked}
            <div class="record-addr">${esc(r.address)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            ${statusBadge(r.status)}
            <button class="act-btn act-copy" data-act="copy" data-addr="${esc(r.address)}">复制地址</button>
          </div>
        </div>
        <div class="record-meta">
          <span class="chip chip-amt">💰 ${esc(r.amount)} USDT</span>
          <span class="chip chip-os">🖥 ${esc(r.os || '未知系统')}</span>
          <span class="chip chip-browser">🌐 ${esc(r.browser || '未知浏览器')}</span>
          <span class="chip chip-ip">IP: ${esc(r.ip || '未知')}</span>
          <span class="chip">⏱ ${esc(fmtTime(r.createdAt))}</span>
        </div>
        <div class="record-actions">
          ${actions}
        </div>
      </div>
    `;
  }).join('');
}

async function auditOne(id, action){
  try {
    const res = await fetch(API_BASE + '/api/audit', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ id: Number(id), action })
    });
    const data = await res.json();
    if (res.ok && data.success) { toast('操作成功'); loadRecords(); }
    else toast(data.error || '操作失败');
  } catch (e) { toast('网络错误'); }
}

async function auditBatch(action){
  const checked = [...document.querySelectorAll('.record-checkbox:checked')].map(c => Number(c.dataset.id));
  if (!checked.length) { toast('请先勾选待审核记录'); return; }
  if (!confirm(`确认对选中的 ${checked.length} 条记录执行「${action === 'approve' ? '通过' : '拒绝'}」操作？`)) return;
  try {
    const res = await fetch(API_BASE + '/api/audit-batch', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ ids: checked, action })
    });
    const data = await res.json();
    if (res.ok && data.success) { toast(`已处理 ${data.count || 0} 条`); loadRecords(); }
    else toast(data.error || '批量操作失败');
  } catch (e) { toast('网络错误'); }
}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents(){
  $('loginBtn').addEventListener('click', doLogin);
  $('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  $('logoutBtn').addEventListener('click', doLogout);

  $('saveTelegramBtn').addEventListener('click', saveTelegram);
  $('saveLimitBtn').addEventListener('click', saveLimit);
  $('changePwdBtn').addEventListener('click', changePwd);

  // 筛选
  $('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    CURRENT_FILTER = btn.dataset.filter;
    renderRecords();
  });

  // 记录列表事件（委托）
  $('recordsList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'approve' || act === 'reject') {
      auditOne(btn.dataset.id, act);
    } else if (act === 'copy') {
      const addr = btn.dataset.addr;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addr).then(() => toast('地址已复制')).catch(() => fallbackCopy(addr));
      } else {
        fallbackCopy(addr);
      }
    }
  });

  $('selectAllChk').addEventListener('change', e => {
    document.querySelectorAll('.record-checkbox').forEach(c => { c.checked = e.target.checked; });
  });

  $('batchApproveBtn').addEventListener('click', () => auditBatch('approve'));
  $('batchRejectBtn').addEventListener('click', () => auditBatch('reject'));
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('地址已复制'); }
  catch { toast('复制失败'); }
  document.body.removeChild(ta);
}

// ============================================================
// 启动
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  bindEvents();
  if (TOKEN) showMain();
  else $('loginView').style.display = 'flex';
});
</script>
