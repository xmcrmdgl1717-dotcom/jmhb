<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin · TRC20 Records</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0B0C10;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px;}
  .login{max-width:380px;margin:80px auto;background:linear-gradient(180deg,#1a1d2c,#10121a);padding:32px;border-radius:16px;box-shadow:0 0 0 1px rgba(0,240,255,.3),0 24px 48px rgba(0,0,0,.5);}
  .login h2{margin:0 0 20px;color:#00F0FF;font-size:18px;text-align:center;letter-spacing:.08em;}
  .login input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,240,255,.35);background:#0a0c14;color:#fff;font-size:15px;outline:none;}
  .login input:focus{border-color:#00F0FF;box-shadow:0 0 14px rgba(0,240,255,.25);}
  .login button{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:linear-gradient(180deg,#67e8f9,#22d3ee);color:#041018;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.06em;}
  .login button:active{transform:translateY(2px);}
  .login .err{color:#ff8aa0;font-size:13px;text-align:center;min-height:18px;margin-top:12px;}
  .panel{display:none;max-width:960px;margin:0 auto;}
  .panel.open{display:block;}
  .panel h1{color:#00F0FF;font-size:20px;margin:0 0 16px;letter-spacing:.06em;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar button{padding:8px 16px;border-radius:8px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00F0FF;cursor:pointer;font-size:13px;transition:background .2s;}
  .toolbar button:hover{background:rgba(0,240,255,.1);}
  .toolbar .count{color:rgba(200,210,230,.6);font-size:13px;margin-left:auto;}
  .rec{background:#141826;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:13px;}
  .rec .addr{color:#7AF7FF;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-weight:600;margin-bottom:6px;font-size:12px;}
  .rec .meta{color:rgba(200,210,230,.6);font-size:11px;display:flex;gap:16px;flex-wrap:wrap;}
  .rec .meta span{display:inline-flex;align-items:center;gap:4px;}
  .empty{color:rgba(200,210,230,.5);text-align:center;padding:60px 0;font-size:14px;}
  .copy-btn{margin-left:auto;padding:2px 8px;font-size:10px;border-radius:6px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00F0FF;cursor:pointer;}
  .copy-btn:hover{background:rgba(0,240,255,.1);}
  /* 修改密码模态框 */
  .modal{position:fixed;inset:0;background:rgba(4,6,12,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal.open{display:flex;}
  .modal-card{width:min(380px,100%);background:linear-gradient(180deg,#1a1d2c,#10121a);border-radius:16px;padding:28px 24px;box-shadow:0 0 0 1px rgba(0,240,255,.3),0 24px 48px rgba(0,0,0,.6);}
  .modal-card h3{margin:0 0 18px;color:#00F0FF;font-size:16px;text-align:center;letter-spacing:.06em;}
  .modal-card label{display:block;font-size:12px;color:rgba(200,210,230,.75);margin-bottom:6px;margin-top:12px;}
  .modal-card input{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,240,255,.35);background:#0a0c14;color:#fff;font-size:14px;outline:none;}
  .modal-card input:focus{border-color:#00F0FF;box-shadow:0 0 14px rgba(0,240,255,.25);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{flex:1;height:44px;border:0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.04em;}
  .btn-primary{background:linear-gradient(180deg,#67e8f9,#22d3ee);color:#041018;}
  .btn-secondary{background:transparent;border:1px solid rgba(0,240,255,.35)!important;color:#00F0FF;}
  .modal-err{color:#ff8aa0;font-size:12px;text-align:center;min-height:16px;margin-top:10px;}
  .modal-ok{color:#7AF7FF;font-size:12px;text-align:center;min-height:16px;margin-top:10px;}
</style>
</head>
<body>
  <div class="login" id="loginBox">
    <h2>🔒 Admin Login</h2>
    <input id="passInput" type="password" placeholder="管理员密码" autocomplete="off"/>
    <button id="loginBtn">登录</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="panel" id="panelBox">
    <h1>📋 TRC20 地址记录</h1>
    <div class="toolbar">
      <button id="refreshBtn">🔄 刷新</button>
      <button id="exportBtn">⬇ 导出 CSV</button>
      <button id="changePwdBtn">🔑 修改密码</button>
      <button id="logoutBtn">🚪 退出</button>
      <span class="count" id="countInfo"></span>
    </div>
    <div id="listBox"></div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal" id="pwdModal">
    <div class="modal-card">
      <h3>🔑 修改管理员密码</h3>
      <label>当前密码</label>
      <input id="oldPwd" type="password" autocomplete="off"/>
      <label>新密码（至少 6 位）</label>
      <input id="newPwd" type="password" autocomplete="off"/>
      <label>确认新密码</label>
      <input id="newPwd2" type="password" autocomplete="off"/>
      <div class="modal-err" id="pwdErr"></div>
      <div class="modal-ok" id="pwdOk"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="pwdCancel">取消</button>
        <button class="btn-primary" id="pwdSubmit">确认修改</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const API_BASE = '';

  const loginBox = document.getElementById('loginBox');
  const panelBox = document.getElementById('panelBox');
  const passInput = document.getElementById('passInput');
  const loginBtn = document.getElementById('loginBtn');
  const errMsg = document.getElementById('errMsg');
  const listBox = document.getElementById('listBox');
  const countInfo = document.getElementById('countInfo');
  const refreshBtn = document.getElementById('refreshBtn');
  const exportBtn = document.getElementById('exportBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const changePwdBtn = document.getElementById('changePwdBtn');
  const pwdModal = document.getElementById('pwdModal');
  const oldPwd = document.getElementById('oldPwd');
  const newPwd = document.getElementById('newPwd');
  const newPwd2 = document.getElementById('newPwd2');
  const pwdErr = document.getElementById('pwdErr');
  const pwdOk = document.getElementById('pwdOk');
  const pwdCancel = document.getElementById('pwdCancel');
  const pwdSubmit = document.getElementById('pwdSubmit');

  let token = sessionStorage.getItem('admin_token') || '';
  let cacheRecords = [];

  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  async function doLogin(){
    const password = passInput.value;
    errMsg.textContent = '';
    if(!password){ errMsg.textContent = '请输入密码'; return; }
    loginBtn.disabled = true;
    loginBtn.textContent = '登录中...';
    try{
      const res = await fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if(!res.ok){
        errMsg.textContent = res.status === 401 ? '密码错误' : '登录失败 (' + res.status + ')';
        return;
      }
      const data = await res.json();
      token = data.token;
      sessionStorage.setItem('admin_token', token);
      showPanel();
    }catch(e){
      errMsg.textContent = '网络错误，请重试';
    }finally{
      loginBtn.disabled = false;
      loginBtn.textContent = '登录';
    }
  }

  async function loadRecords(){
    if(!token) return;
    listBox.innerHTML = '<div class="empty">加载中...</div>';
    try{
      const res = await fetch(API_BASE + '/api/records', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(res.status === 401){ logout(); return; }
      if(!res.ok){
        listBox.innerHTML = '<div class="empty">加载失败 (' + res.status + ')</div>';
        return;
      }
      const data = await res.json();
      cacheRecords = data.records || [];
      renderRecords(cacheRecords);
    }catch(e){
      listBox.innerHTML = '<div class="empty">网络错误，请重试</div>';
    }
  }

  function renderRecords(records){
    countInfo.textContent = '共 ' + records.length + ' 条记录';
    if(!records.length){
      listBox.innerHTML = '<div class="empty">暂无记录</div>';
      return;
    }
    listBox.innerHTML = records.map((r, i) => `
      <div class="rec">
        <div class="addr" style="display:flex;align-items:center;gap:8px;">
          <span>${escapeHtml(r.address)}</span>
          <button class="copy-btn" data-addr="${escapeHtml(r.address)}">复制</button>
        </div>
        <div class="meta">
          <span>#${i+1}</span>
          <span>🕐 ${escapeHtml(r.time_local || r.time || '未知时间')}</span>
          <span>💰 ${escapeHtml(String(r.balance || '0.00'))} USDT</span>
          ${r.ip ? `<span>🌐 ${escapeHtml(r.ip)}</span>` : ''}
        </div>
      </div>
    `).join('');

    listBox.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const addr = btn.dataset.addr;
        navigator.clipboard.writeText(addr).then(() => {
          const old = btn.textContent;
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = old, 1200);
        }).catch(() => {
          btn.textContent = '失败';
          setTimeout(() => btn.textContent = '复制', 1200);
        });
      });
    });
  }

  function exportCSV(){
    if(!cacheRecords.length){ alert('暂无数据可导出'); return; }
    const header = ['地址', '余额', '时间', 'IP'];
    const rows = cacheRecords.map(r => [
      r.address,
      r.balance || '0.00',
      r.time_local || r.time || '',
      r.ip || ''
    ]);
    const csv = [header, ...rows]
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trc20_records_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function showPanel(){
    loginBox.style.display = 'none';
    panelBox.classList.add('open');
    loadRecords();
  }

  function logout(){
    token = '';
    sessionStorage.removeItem('admin_token');
    cacheRecords = [];
    panelBox.classList.remove('open');
    loginBox.style.display = 'block';
    passInput.value = '';
    listBox.innerHTML = '';
  }

  // ===== 修改密码 =====
  function openPwdModal(){
    oldPwd.value = '';
    newPwd.value = '';
    newPwd2.value = '';
    pwdErr.textContent = '';
    pwdOk.textContent = '';
    pwdModal.classList.add('open');
    setTimeout(() => oldPwd.focus(), 100);
  }
  function closePwdModal(){
    pwdModal.classList.remove('open');
  }
  async function submitPwdChange(){
    pwdErr.textContent = '';
    pwdOk.textContent = '';
    if(!oldPwd.value){ pwdErr.textContent = '请输入当前密码'; return; }
    if(!newPwd.value || newPwd.value.length < 6){ pwdErr.textContent = '新密码至少 6 位'; return; }
    if(newPwd.value !== newPwd2.value){ pwdErr.textContent = '两次输入的新密码不一致'; return; }
    pwdSubmit.disabled = true;
    pwdSubmit.textContent = '提交中...';
    try{
      const res = await fetch(API_BASE + '/api/change-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ oldPassword: oldPwd.value, newPassword: newPwd.value })
      });
      if(res.status === 401){
        pwdErr.textContent = '当前密码错误';
        return;
      }
      if(!res.ok){
        pwdErr.textContent = '修改失败 (' + res.status + ')';
        return;
      }
      pwdOk.textContent = '✓ 密码修改成功，请重新登录';
      setTimeout(() => {
        closePwdModal();
        logout();
      }, 1500);
    }catch(e){
      pwdErr.textContent = '网络错误，请重试';
    }finally{
      pwdSubmit.disabled = false;
      pwdSubmit.textContent = '确认修改';
    }
  }

  loginBtn.addEventListener('click', doLogin);
  passInput.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  refreshBtn.addEventListener('click', loadRecords);
  exportBtn.addEventListener('click', exportCSV);
  logoutBtn.addEventListener('click', logout);
  changePwdBtn.addEventListener('click', openPwdModal);
  pwdCancel.addEventListener('click', closePwdModal);
  pwdSubmit.addEventListener('click', submitPwdChange);

  if(token) showPanel();
})();
</script>
</body>
</html>
