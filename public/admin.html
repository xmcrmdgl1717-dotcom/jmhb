<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin · TRC20 Records</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0B0C10;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px;}
  .lang-switch{position:fixed;top:14px;right:18px;z-index:100;display:flex;gap:6px;}
  .lang-switch button{padding:6px 12px;border-radius:8px;border:1px solid rgba(0,240,255,.3);background:rgba(19,21,31,.85);color:#00F0FF;cursor:pointer;font-size:12px;letter-spacing:.06em;}
  .lang-switch button.active{background:rgba(0,240,255,.15);border-color:rgba(0,240,255,.7);}
  .login{max-width:380px;margin:80px auto;background:linear-gradient(180deg,#1a1d2c,#10121a);padding:32px;border-radius:16px;box-shadow:0 0 0 1px rgba(0,240,255,.3),0 24px 48px rgba(0,0,0,.5);}
  .login h2{margin:0 0 20px;color:#00F0FF;font-size:18px;text-align:center;letter-spacing:.08em;}
  .login input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,240,255,.35);background:#0a0c14;color:#fff;font-size:15px;outline:none;}
  .login input:focus{border-color:#00F0FF;box-shadow:0 0 14px rgba(0,240,255,.25);}
  .login button{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:linear-gradient(180deg,#67e8f9,#22d3ee);color:#041018;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.06em;}
  .login button:active{transform:translateY(2px);}
  .login .err{color:#ff8aa0;font-size:13px;text-align:center;min-height:18px;margin-top:12px;}
  .panel{display:none;max-width:1200px;margin:0 auto;}
  .panel.open{display:block;}
  .panel h1{color:#00F0FF;font-size:20px;margin:0 0 16px;letter-spacing:.06em;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:#141826;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;cursor:pointer;transition:all .18s;}
  .stat:hover{border-color:rgba(0,240,255,.4);transform:translateY(-1px);}
  .stat.active{border-color:rgba(0,240,255,.7);background:rgba(0,240,255,.06);}
  .stat .k{font-size:11px;color:rgba(200,210,230,.6);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
  .stat .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:22px;color:#7AF7FF;}
  .stat.ios .v{color:#c084fc;}
  .stat.desktop .v{color:#7af7ff;}
  .stat.unknown .v{color:#FFD700;}
  .stat.pending .v{color:#FFD700;}
  .stat.approved .v{color:#00FFAA;}
  .stat.rejected .v{color:#ff5a7a;}
  .filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;background:#141826;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;}
  .filters label{font-size:12px;color:rgba(200,210,230,.7);margin-right:4px;}
  .filters select,.filters input{height:34px;padding:0 10px;border-radius:8px;border:1px solid rgba(0,240,255,.3);background:#0a0c14;color:#e8eefc;font-size:13px;outline:none;}
  .filters select:focus,.filters input:focus{border-color:#00F0FF;box-shadow:0 0 10px rgba(0,240,255,.2);}
  .filters button{padding:8px 16px;border-radius:8px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00F0FF;cursor:pointer;font-size:13px;}
  .filters button:hover{background:rgba(0,240,255,.1);}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar button{padding:8px 16px;border-radius:8px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00F0FF;cursor:pointer;font-size:13px;transition:background .2s;}
  .toolbar button:hover{background:rgba(0,240,255,.1);}
  .toolbar button.btn-approve{border-color:rgba(0,255,170,.4);color:#00FFAA;}
  .toolbar button.btn-approve:hover{background:rgba(0,255,170,.1);}
  .toolbar button.btn-reject{border-color:rgba(255,90,122,.4);color:#ff5a7a;}
  .toolbar button.btn-reject:hover{background:rgba(255,90,122,.1);}
  .toolbar .count{color:rgba(200,210,230,.6);font-size:13px;margin-left:auto;}
  .rec{background:#141826;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:13px;position:relative;}
  .rec.decided{opacity:.85;}
  .rec .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;padding-right:220px;}
  .rec .cb{width:18px;height:18px;margin-top:3px;flex-shrink:0;cursor:pointer;accent-color:#00F0FF;}
  .rec .cb:disabled{opacity:.3;cursor:not-allowed;}
  .rec .addr{color:#7AF7FF;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-weight:600;font-size:12px;flex:1;}
  .rec .status-badge{padding:3px 10px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.06em;flex-shrink:0;}
  .rec .status-badge.pending{color:#FFD700;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.35);}
  .rec .status-badge.approved{color:#00FFAA;background:rgba(0,255,170,.1);border:1px solid rgba(0,255,170,.35);}
  .rec .status-badge.rejected{color:#ff5a7a;background:rgba(255,90,122,.1);border:1px solid rgba(255,90,122,.35);}
  .rec .actions{position:absolute;top:12px;right:16px;display:flex;gap:6px;align-items:center;}
  .rec .actions button{padding:5px 12px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid;background:transparent;letter-spacing:.04em;}
  .rec .actions .btn-ap{border-color:rgba(0,255,170,.4);color:#00FFAA;}
  .rec .actions .btn-ap:hover:not(:disabled){background:rgba(0,255,170,.12);}
  .rec .actions .btn-rj{border-color:rgba(255,90,122,.4);color:#ff5a7a;}
  .rec .actions .btn-rj:hover:not(:disabled){background:rgba(255,90,122,.12);}
  .rec .actions button:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(.5);}
  .rec .times{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:rgba(200,210,230,.7);margin-bottom:6px;}
  .rec .times .t{display:inline-flex;align-items:center;gap:4px;}
  .rec .times .t.visit{color:#c084fc;}
  .rec .times .t.submit{color:#7AF7FF;}
  .rec .times .t.duration{color:#FFD700;}
  .rec .meta{color:rgba(200,210,230,.6);font-size:11px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
  .rec .meta span{display:inline-flex;align-items:center;gap:4px;}
  .rec .meta .badge{padding:2px 8px;border-radius:6px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);color:#7AF7FF;}
  .rec .meta .badge-device.android{background:rgba(0,240,255,.12);border-color:rgba(0,240,255,.4);color:#7AF7FF;}
  .rec .meta .badge-device.ios{background:rgba(176,38,255,.14);border-color:rgba(176,38,255,.4);color:#c084fc;}
  .rec .meta .badge-device.desktop{background:rgba(0,240,255,.14);border-color:rgba(0,240,255,.45);color:#7af7ff;}
  .rec .meta .badge-device.unknown{background:rgba(255,209,102,.1);border-color:rgba(255,209,102,.3);color:#FFD700;}
  .rec .meta .badge-lang{background:rgba(255,209,102,.08);border-color:rgba(255,209,102,.3);color:#FFD700;}
  .rec .meta .badge-country{background:rgba(0,255,170,.1);border-color:rgba(0,255,170,.3);color:#00FFAA;}
  .empty{color:rgba(200,210,230,.5);text-align:center;padding:60px 0;font-size:14px;}
  .copy-btn{padding:2px 8px;font-size:10px;border-radius:6px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00F0FF;cursor:pointer;margin-left:auto;}
  .copy-btn:hover{background:rgba(0,240,255,.1);}
  .modal{position:fixed;inset:0;background:rgba(4,6,12,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal.open{display:flex;}
  .modal-card{width:min(400px,100%);background:linear-gradient(180deg,#1a1d2c,#10121a);border-radius:16px;padding:28px 24px;box-shadow:0 0 0 1px rgba(0,240,255,.3),0 24px 48px rgba(0,0,0,.6);}
  .modal-card h3{margin:0 0 18px;color:#00F0FF;font-size:16px;text-align:center;letter-spacing:.06em;}
  .modal-card label{display:block;font-size:12px;color:rgba(200,210,230,.75);margin-bottom:6px;margin-top:12px;}
  .modal-card input{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,240,255,.35);background:#0a0c14;color:#fff;font-size:14px;outline:none;}
  .modal-card input:focus{border-color:#00F0FF;box-shadow:0 0 14px rgba(0,240,255,.25);}
  .modal-card .hint{font-size:11px;color:rgba(200,210,230,.5);margin-top:6px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{flex:1;height:44px;border:0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.04em;}
  .btn-primary{background:linear-gradient(180deg,#67e8f9,#22d3ee);color:#041018;}
  .btn-secondary{background:transparent;border:1px solid rgba(0,240,255,.35)!important;color:#00F0FF;}
  .modal-err{color:#ff8aa0;font-size:12px;text-align:center;min-height:16px;margin-top:10px;}
  .modal-ok{color:#7AF7FF;font-size:12px;text-align:center;min-height:16px;margin-top:10px;}
  /* 确认弹窗 */
  .confirm-card h3{margin:0 0 12px;color:#00F0FF;font-size:16px;text-align:center;}
  .confirm-card p{margin:0 0 8px;font-size:14px;line-height:1.6;color:rgba(220,230,245,.9);text-align:center;}
</style>
</head>
<body>
  <div class="lang-switch">
    <button id="langZh" class="active">中文</button>
    <button id="langEn">English</button>
  </div>

  <div class="login" id="loginBox">
    <h2 id="loginTitle">🔒 管理员登录</h2>
    <input id="passInput" type="password" placeholder="管理员密码" autocomplete="off"/>
    <button id="loginBtn">登录</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="panel" id="panelBox">
    <h1 id="panelTitle">📋 TRC20 地址记录</h1>

    <div class="stats" id="statsBox">
      <div class="stat" data-device="all"><div class="k" id="sTotalK">总记录</div><div class="v" id="statTotal">0</div></div>
      <div class="stat" data-device="android"><div class="k" id="sAndK">📱 安卓</div><div class="v" id="statAndroid">0</div></div>
      <div class="stat ios" data-device="ios"><div class="k" id="sIosK">🍎 苹果</div><div class="v" id="statIOS">0</div></div>
      <div class="stat desktop" data-device="desktop"><div class="k" id="sDeskK">🖥 桌面</div><div class="v" id="statDesktop">0</div></div>
      <div class="stat unknown" data-device="unknown"><div class="k" id="sUnkK">❓ 未知设备</div><div class="v" id="statUnknown">0</div></div>
      <div class="stat pending" data-audit="pending"><div class="k" id="sPenK">⏳ 等待审核</div><div class="v" id="statPending">0</div></div>
      <div class="stat approved" data-audit="approved"><div class="k" id="sAprK">✅ 已通过</div><div class="v" id="statApproved">0</div></div>
      <div class="stat rejected" data-audit="rejected"><div class="k" id="sRejK">❌ 已拒绝</div><div class="v" id="statRejected">0</div></div>
    </div>

    <div class="filters">
      <label id="filterTimeLabel">时间：</label>
      <select id="filterRange">
        <option value="all">全部</option>
        <option value="today">今天</option>
        <option value="7d">近 7 天</option>
        <option value="30d">近 30 天</option>
        <option value="custom">自定义</option>
      </select>
      <input type="date" id="filterFrom" style="display:none"/>
      <input type="date" id="filterTo" style="display:none"/>
      <label id="filterDeviceLabel">设备：</label>
      <select id="filterDevice">
        <option value="all">全部</option>
        <option value="android">安卓</option>
        <option value="ios">苹果</option>
        <option value="desktop">桌面</option>
        <option value="unknown">未知</option>
      </select>
      <label id="filterAuditLabel">审核状态：</label>
      <select id="filterAudit">
        <option value="all">全部</option>
        <option value="pending">等待审核</option>
        <option value="approved">已通过</option>
        <option value="rejected">已拒绝</option>
      </select>
      <button id="resetFilters">重置</button>
    </div>

    <div class="toolbar">
      <button id="refreshBtn">🔄 刷新</button>
      <button id="exportBtn">⬇ 导出 CSV（当前筛选）</button>
      <button id="bulkApproveBtn" class="btn-approve">✅ 批量通过</button>
      <button id="bulkRejectBtn" class="btn-reject">❌ 批量拒绝</button>
      <button id="settingsBtn">⚙️ 设置</button>
      <button id="changePwdBtn">🔑 修改密码</button>
      <button id="logoutBtn">🚪 退出</button>
      <span class="count" id="countInfo"></span>
    </div>
    <div id="listBox"></div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3 id="settingsTitle">⚙️ 每日提现次数设置</h3>
      <label id="settingsLabel">每个 IP 每天可完整提现的次数</label>
      <input id="dailyLimitInput" type="number" min="1" max="100" value="1"/>
      <div class="hint" id="settingsHint">例如设为 2，则每个 IP 每天可完整玩 2 轮。北京时间 0 点重置。</div>
      <div class="modal-err" id="settingsErr"></div>
      <div class="modal-ok" id="settingsOk"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="settingsCancel">取消</button>
        <button class="btn-primary" id="settingsSubmit">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="pwdModal">
    <div class="modal-card">
      <h3 id="pwdTitle">🔑 修改管理员密码</h3>
      <label id="pwdLabel1">当前密码</label>
      <input id="oldPwd" type="password" autocomplete="off"/>
      <label id="pwdLabel2">新密码（至少 6 位）</label>
      <input id="newPwd" type="password" autocomplete="off"/>
      <label id="pwdLabel3">确认新密码</label>
      <input id="newPwd2" type="password" autocomplete="off"/>
      <div class="modal-err" id="pwdErr"></div>
      <div class="modal-ok" id="pwdOk"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="pwdCancel">取消</button>
        <button class="btn-primary" id="pwdSubmit">确认修改</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="modal" id="confirmModal">
    <div class="modal-card confirm-card">
      <h3 id="confirmTitle">⚠️ 确认</h3>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="confirmCancel">取消</button>
        <button class="btn-primary" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  function t(key, params) {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
    if (params) Object.keys(params).forEach(k => { s = s.replace('{' + k + '}', params[k]); });
    return s;
  }

  function escapeHtml(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function parseDevice(ua){
    if(!ua) return '—';
    const s = ua.toLowerCase();
    let os = '';
    if(/iphone/.test(s)) os = 'iPhone';
    else if(/ipad/.test(s)) os = 'iPad';
    else if(/android/.test(s)) os = 'Android';
    else if(/windows/.test(s)) os = 'Windows';
    else if(/mac os|macintosh/.test(s)) os = 'Mac';
    else if(/linux/.test(s)) os = 'Linux';
    else if(/cros/.test(s)) os = 'ChromeOS';
    let browser = '';
    if(/edg\//.test(s)) browser = 'Edge';
    else if(/chrome\//.test(s) && !/edg\//.test(s)) browser = 'Chrome';
    else if(/safari/.test(s) && !/chrome/.test(s)) browser = 'Safari';
    else if(/firefox/.test(s)) browser = 'Firefox';
    else if(/opera|opr\//.test(s)) browser = 'Opera';
    return [os, browser].filter(Boolean).join(' · ') || '—';
  }

  function getDeviceType(r){
    if(r.device && ['android','ios','desktop','unknown'].includes(r.device)) return r.device;
    const ua = (r.userAgent || '').toLowerCase();
    if(/iphone|ipad|ipod/.test(ua)) return 'ios';
    if(/android/.test(ua)) return 'android';
    if(/windows|mac os|macintosh|linux|x11|cros/.test(ua)) return 'desktop';
    return 'unknown';
  }
  function getAuditStatus(r){ return r.auditStatus || 'pending'; }
  function isDecided(r) { const s = getAuditStatus(r); return s === 'approved' || s === 'rejected'; }

  function formatCountry(r){
    const code = (r.country || '').toUpperCase();
    if (code && CODE_TO_COUNTRY[code]) return CODE_TO_COUNTRY[code];
    const l = (r.language || '').toLowerCase().split('-')[0];
    if (l && LANG_TO_COUNTRY[l]) return LANG_TO_COUNTRY[l];
    return '❓ 未知';
  }

  function calcDuration(v, s){
    if(!v || !s) return '';
    try{
      const t1 = new Date(v).getTime(), t2 = new Date(s).getTime();
      if(isNaN(t1) || isNaN(t2) || t2 < t1) return '';
      const sec = Math.round((t2 - t1)/1000);
      if(sec < 60) return sec + 's';
      return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
    }catch(e){ return ''; }
  }

  async function doLogin(){
    const password = $('passInput').value;
    $('errMsg').textContent = '';
    if(!password){ $('errMsg').textContent = t('loginErrEmpty'); return; }
    $('loginBtn').disabled = true;
    try{
      const res = await fetch(API_BASE + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
      if(!res.ok){ $('errMsg').textContent = res.status === 401 ? t('loginErrWrong') : ('Failed (' + res.status + ')'); return; }
      const data = await res.json();
      token = data.token;
      sessionStorage.setItem('admin_token', token);
      showPanel();
    }catch(e){ $('errMsg').textContent = t('loginErrNet'); }
    finally{ $('loginBtn').disabled = false; }
  }

  async function loadRecords(){
    if(!token) return;
    $('listBox').innerHTML = '<div class="empty">' + t('loading') + '</div>';
    try{
      const res = await fetch(API_BASE + '/api/records', { headers: { 'Authorization': 'Bearer ' + token } });
      if(res.status === 401){ logout(); return; }
      if(!res.ok){ $('listBox').innerHTML = '<div class="empty">' + t('loadFail', {n:res.status}) + '</div>'; return; }
      const data = await res.json();
      cacheRecords = data.records || [];
      for (const id of Array.from(selectedIds)) {
        if (!cacheRecords.find(r => r.id === id)) selectedIds.delete(id);
      }
      applyFilters();
    }catch(e){ $('listBox').innerHTML = '<div class="empty">' + t('loginErrNet') + '</div>'; }
  }

  function inRange(r){
    const range = $('filterRange').value;
    if(range === 'all') return true;
    const tt = r.time ? new Date(r.time).getTime() : 0;
    if(!tt) return false;
    const now = Date.now();
    if(range === 'today'){ const d = new Date(); const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); return tt >= start; }
    if(range === '7d') return tt >= now - 7*24*60*60*1000;
    if(range === '30d') return tt >= now - 30*24*60*60*1000;
    if(range === 'custom'){
      const from = $('filterFrom').value ? new Date($('filterFrom').value).getTime() : 0;
      const to = $('filterTo').value ? new Date($('filterTo').value).getTime() + 86400000 - 1 : Infinity;
      return tt >= from && tt <= to;
    }
    return true;
  }

  function applyFilters(){
    filteredRecords = cacheRecords.filter(r => {
      if(!inRange(r)) return false;
      if(deviceFilter !== 'all' && getDeviceType(r) !== deviceFilter) return false;
      if(auditFilter !== 'all' && getAuditStatus(r) !== auditFilter) return false;
      return true;
    });

    const dev = { android: 0, ios: 0, desktop: 0, unknown: 0 };
    const aud = { pending: 0, approved: 0, rejected: 0 };
    cacheRecords.forEach(r => {
      const d = getDeviceType(r);
      dev[d] = (dev[d] || 0) + 1;
      const a = getAuditStatus(r);
      aud[a] = (aud[a] || 0) + 1;
    });
    $('statTotal').textContent = cacheRecords.length;
    $('statAndroid').textContent = dev.android || 0;
    $('statIOS').textContent = dev.ios || 0;
    $('statDesktop').textContent = dev.desktop || 0;
    $('statUnknown').textContent = dev.unknown || 0;
    $('statPending').textContent = aud.pending || 0;
    $('statApproved').textContent = aud.approved || 0;
    $('statRejected').textContent = aud.rejected || 0;

    document.querySelectorAll('.stat[data-device]').forEach(el => el.classList.toggle('active', deviceFilter !== 'all' && el.dataset.device === deviceFilter));
    document.querySelectorAll('.stat[data-audit]').forEach(el => el.classList.toggle('active', auditFilter !== 'all' && el.dataset.audit === auditFilter));

    $('countInfo').textContent = t('countInfo', { n: filteredRecords.length });
    renderRecords(filteredRecords);
  }

  function renderRecords(records){
    if(!records.length){ $('listBox').innerHTML = '<div class="empty">' + t('empty') + '</div>'; return; }
    listBox.innerHTML = records.map((r, i) => {
      const deviceName = parseDevice(r.userAgent);
      const deviceType = getDeviceType(r);
      const l = r.language || '—';
      const country = formatCountry(r);
      const visitTime = r.visit_time_local || '—';
      const submitTime = r.time_local || r.time || '—';
      const duration = calcDuration(r.visit_time, r.time);
      const auditStatus = getAuditStatus(r);
      const decided = isDecided(r);
      const isChecked = selectedIds.has(r.id);
      // 已审核的记录，两个按钮都禁用
      const btnDisabled = decided ? 'disabled' : '';
      return `
      <div class="rec ${decided?'decided':''}">
        <div class="actions">
          <button class="btn-ap" data-audit="approved" data-id="${escapeHtml(r.id)}" ${btnDisabled}>✅ ${t('btnApprove')}</button>
          <button class="btn-rj" data-audit="rejected" data-id="${escapeHtml(r.id)}" ${btnDisabled}>❌ ${t('btnReject')}</button>
        </div>
        <div class="top">
          <input type="checkbox" class="cb" data-id="${escapeHtml(r.id)}" ${isChecked?'checked':''} ${decided?'disabled':''}/>
          <div class="addr">${escapeHtml(r.address)}</div>
          <span class="status-badge ${auditStatus}"></span>
        </div>
        <div class="times">
          <span class="t visit">${t('timeEnter')}: ${escapeHtml(visitTime)}</span>
          <span class="t submit">${t('timeSubmit')}: ${escapeHtml(submitTime)}</span>
          ${duration ? `<span class="t duration">${t('timeDuration')}: ${escapeHtml(duration)}</span>` : ''}
        </div>
        <div class="meta">
          <span>#${i+1}</span>
          <span>💰 ${escapeHtml(String(r.balance || '0.00'))} USDT</span>
          <span class="badge badge-country">🌍 ${escapeHtml(country)}</span>
          ${r.ip ? `<span class="badge">🌐 ${escapeHtml(r.ip)}</span>` : ''}
          <span class="badge badge-device ${deviceType}">📱 ${escapeHtml(deviceName)}</span>
          <span class="badge badge-lang">🗣 ${escapeHtml(l)}</span>
          <button class="copy-btn" data-addr="${escapeHtml(r.address)}">${t('btnCopy')}</button>
        </div>
      </div>`;
    }).join('');

    listBox.querySelectorAll('.rec').forEach((el, idx) => {
      const r = records[idx];
      if(!r) return;
      const badge = el.querySelector('.status-badge');
      const st = getAuditStatus(r);
      badge.classList.remove('pending','approved','rejected');
      badge.classList.add(st);
      badge.textContent = st === 'approved' ? t('optApproved') : st === 'rejected' ? t('optRejected') : t('optPending');
    });

    listBox.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.addr).then(() => {
          const o = btn.textContent; btn.textContent = t('btnCopied'); setTimeout(()=>btn.textContent=o, 1000);
        }).catch(() => { btn.textContent = t('btnCopyFail'); setTimeout(()=>btn.textContent=t('btnCopy'), 1000); });
      });
    });
    listBox.querySelectorAll('.cb').forEach(cb => {
      cb.addEventListener('change', () => {
        if(cb.checked) selectedIds.add(cb.dataset.id);
        else selectedIds.delete(cb.dataset.id);
      });
    });
    listBox.querySelectorAll('.btn-ap, .btn-rj').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const status = btn.dataset.audit;
        const r = cacheRecords.find(x => x.id === id);
        if (!r) return;
        // 前端二次防护
        if (isDecided(r)) { alert(t('auditAlreadyDone')); return; }
        const amount = r.balance;
        const isReject = status === 'rejected';
        const text = (isReject ? t('confirmRejectText') : t('confirmApproveText')).replace('{amount}', amount);
        showConfirm(t('confirmTitle'), text, () => auditOne(id, status));
      });
    });
  }

  function showConfirm(title, text, onOk){
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    $('confirmModal').classList.add('open');
    const ok = $('confirmOk');
    const cancel = $('confirmCancel');
    const cleanup = () => {
      ok.removeEventListener('click', handlerOk);
      cancel.removeEventListener('click', handlerCancel);
    };
    const handlerOk = () => { cleanup(); $('confirmModal').classList.remove('open'); onOk && onOk(); };
    const handlerCancel = () => { cleanup(); $('confirmModal').classList.remove('open'); };
    ok.addEventListener('click', handlerOk);
    cancel.addEventListener('click', handlerCancel);
  }

  async function auditOne(id, status){
    try{
      const res = await fetch(API_BASE + '/api/audit', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token},
        body: JSON.stringify({ id, status })
      });
      if(res.status === 401){ logout(); return; }
      if(res.status === 409){ alert(t('auditAlreadyDone')); return; }
      if(!res.ok){ alert(t('batchFail')); return; }
      const r = cacheRecords.find(x => x.id === id);
      if(r) r.auditStatus = status;
      applyFilters();
    }catch(e){ alert(t('batchFail')); }
  }

  async function auditBatch(status){
    if(!selectedIds.size){ alert(t('batchNone')); return; }
    const ids = Array.from(selectedIds);
    const isReject = status === 'rejected';
    const text = (isReject ? t('bulkRejectText') : t('bulkApproveText')).replace('{n}', ids.length);
    showConfirm(t('confirmTitle'), text, () => doAuditBatch(ids, status));
  }

  async function doAuditBatch(ids, status){
    try{
      const res = await fetch(API_BASE + '/api/audit-batch', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token},
        body: JSON.stringify({ ids, status })
      });
      if(res.status === 401){ logout(); return; }
      if(!res.ok){ alert(t('batchFail')); return; }
      const data = await res.json();
      // 本地同步状态（只更新还没审核的）
      cacheRecords.forEach(r => {
        if(ids.includes(r.id) && !isDecided(r)) r.auditStatus = status;
      });
      selectedIds.clear();
      applyFilters();
      if (data.skipped > 0) {
        alert(t('batchResultWithSkip', { n: data.updated, s: data.skipped }));
      }
    }catch(e){ alert(t('batchFail')); }
  }

  function exportCSV(){
    if(!filteredRecords.length){ alert(t('empty')); return; }
    const header = lang === 'en'
      ? ['Address','Balance','Country','Enter','Submit','Duration','IP','Device Type','Device','Language','Audit Status']
      : ['地址','余额','国家/地区','进入时间','提交时间','耗时','IP','设备类型','设备','设备语言','审核状态'];
    const rows = filteredRecords.map(r => [
      r.address, r.balance || '0.00', formatCountry(r),
      r.visit_time_local || '', r.time_local || r.time || '', calcDuration(r.visit_time, r.time),
      r.ip || '', getDeviceType(r), parseDevice(r.userAgent), r.language || '',
      getAuditStatus(r)
    ]);
    const csv = [header, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trc20_records_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click(); URL.revokeObjectURL(url);
  }

    applyFilters();
  });
  $('filterFrom').addEventListener('change', applyFilters);
  $('filterTo').addEventListener('change', applyFilters);
  $('filterDevice').addEventListener('change', () => { deviceFilter = $('filterDevice').value; applyFilters(); });
  $('filterAudit').addEventListener('change', () => { auditFilter = $('filterAudit').value; applyFilters(); });
  $('resetFilters').addEventListener('click', () => {
    $('filterRange').value = 'all'; $('filterFrom').value = ''; $('filterTo').value = '';
    $('filterFrom').style.display = 'none'; $('filterTo').style.display = 'none';
    deviceFilter = 'all'; $('filterDevice').value = 'all';
    auditFilter = 'all'; $('filterAudit').value = 'all';
    applyFilters();
  });

  document.querySelectorAll('.stat[data-device]').forEach(el => {
    el.addEventListener('click', () => {
      deviceFilter = el.dataset.device;
      $('filterDevice').value = deviceFilter;
      applyFilters();
    });
  });
  document.querySelectorAll('.stat[data-audit]').forEach(el => {
    el.addEventListener('click', () => {
      auditFilter = el.dataset.audit;
      $('filterAudit').value = auditFilter;
      applyFilters();
    });
  });

  $('langZh').addEventListener('click', () => { lang = 'zh'; localStorage.setItem('admin_lang', lang); applyLanguage(); });
  $('langEn').addEventListener('click', () => { lang = 'en'; localStorage.setItem('admin_lang', lang); applyLanguage(); });

  applyLanguage();
  if(token) showPanel();
})();
</script>
</body>
</html>
