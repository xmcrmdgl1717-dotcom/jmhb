<!-- ================= 客服按钮相关样式和HTML ================= -->
<style>
    .tg-float-btn {
        position: fixed; bottom: 20px; right: 20px; z-index: 9999;
        display: none; background: #0088cc; border-radius: 50%;
        width: 50px; height: 50px; align-items: center; justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-decoration: none;
    }
    .tg-float-btn svg { width: 28px; height: 28px; fill: white; }
    .tg-modal-btn {
        display: none; background: #0088cc; color: white; padding: 10px 20px;
        border-radius: 5px; text-decoration: none; font-weight: bold;
        margin-left: 10px; text-align: center; border: none; cursor: pointer;
    }
</style>

<!-- 悬浮按钮 -->
<a id="floatingTgBtn" href="#" target="_blank" class="tg-float-btn">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.89 1.2-5.34 3.52-.5.34-.95.5-1.35.49-.44-.01-1.29-.25-1.92-.46-.78-.25-1.4-.39-1.35-.82.03-.22.29-.45.78-.69 3.05-1.33 5.08-2.21 6.09-2.64 2.9-1.21 3.5-1.42 3.89-1.42.09 0 .28.02.4.12.11.09.14.21.15.3z"/></svg>
</a>

<!-- 提示：提现记录弹窗里的“联系客服”按钮，请你在弹窗代码里手动加一个 <a id="modalContactBtn" href="#" target="_blank" class="tg-modal-btn">联系客服</a>，排在关闭按钮后面 -->

<!-- ================= 完整JS逻辑 ================= -->
<script>
    // 1. 获取配置并显示飞机按钮
    fetch('/api/public-settings')
        .then(res => res.json())
        .then(data => {
            if (data.telegramLink) {
                const floatBtn = document.getElementById('floatingTgBtn');
                if(floatBtn) {
                    floatBtn.href = data.telegramLink;
                    floatBtn.style.display = 'flex';
                }
                const modalBtn = document.getElementById('modalContactBtn');
                if(modalBtn) {
                    modalBtn.href = data.telegramLink;
                    modalBtn.style.display = 'inline-block';
                }
            }
        });

    // 2. 强制 Safari 拦截核心函数（复制链接）
    function forceCopyLink(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            const successful = document.execCommand('copy');
            if(successful) {
                alert('链接已复制！请打开 Safari 浏览器，粘贴并访问。');
            } else {
                prompt('复制失败，请手动复制以下链接：', text);
            }
        } catch (err) {
            prompt('复制失败，请手动复制以下链接：', text);
        }
        document.body.removeChild(textArea);
    }

    // 3. 全局拦截“立即旋转”按钮的点击
    document.addEventListener('DOMContentLoaded', function() {
        // 请将 'spinBtn' 替换为你实际“立即旋转”按钮的 ID
        const spinBtn = document.getElementById('spinBtn') || document.querySelector('.spin-btn');
        
        if (spinBtn) {
            // 使用捕获阶段，确保在原有旋转逻辑之前触发
            spinBtn.addEventListener('click', function(e) {
                const ua = navigator.userAgent;
                const isIOS = /iPhone|iPad|iPod/.test(ua);
                const isNotSafari = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) || (isIOS && !/Safari/.test(ua));

                if (isIOS && isNotSafari) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const copyLink = window.location.href;
                    const userConfirmed = confirm(`检测到您正在非Safari浏览器中打开。\n\n为保证游戏正常运行，请点击“确定”复制链接，然后打开您手机自带的 Safari 浏览器，粘贴并访问。`);
                    
                    if (userConfirmed) {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(copyLink).then(() => {
                                alert('链接已复制！请打开 Safari 浏览器，粘贴并访问。');
                            }).catch(() => {
                                forceCopyLink(copyLink);
                            });
                        } else {
                            forceCopyLink(copyLink);
                        }
                    }
                    return false;
                }
            }, true); // true 表示捕获阶段执行
        }
    });
</script>
